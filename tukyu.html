<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lion Grand Prix: Ultimate Edition</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            color: #f39c12;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 5px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #f39c12;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }
        #stats-bar {
            display: flex;
            justify-content: space-around;
            background: #1e1e2f;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #00ffcc;
        }
        .track {
            background: #252538;
            border-top: 3px dashed #555;
            border-bottom: 3px dashed #555;
            height: 65px;
            position: relative;
            margin: 10px 0;
            display: flex;
            align-items: center;
            border-radius: 6px;
        }
        .finish-line {
            position: absolute;
            right: 40px;
            top: 0;
            width: 10px;
            height: 100%;
            background: repeating-linear-gradient(
                0deg, #fff, #fff 10px, #000 10px, #000 20px
            );
            z-index: 1;
        }
        .lion-racer {
            position: absolute;
            left: 10px;
            font-size: 32px;
            transition: left 0.05s linear;
            z-index: 2;
        }
        .lane-info {
            position: absolute;
            left: 15px;
            bottom: 2px;
            font-size: 11px;
            color: #aaa;
            z-index: 3;
        }
        .controls-panel {
            margin-top: 20px;
            background: #1a1a24;
            padding: 15px;
            border-radius: 8px;
        }
        select, button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            margin: 5px;
        }
        select {
            background: #fff;
            color: #333;
        }
        button {
            background-color: #e74c3c;
            color: white;
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.4);
            transition: 0.2s;
        }
        button:hover {
            background-color: #c0392b;
            transform: scale(1.05);
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        #announcer {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            min-height: 30px;
            color: #f1c40f;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🦁 LION GRAND PRIX: ULTIMATE 🏎️</h1>
        <p>Pilih jagoanmu, atur strategi, dan menangkan taruhannya!</p>

        <div id="stats-bar">
            <div>💰 Saldo Koin: <span id="coinCount">100</span></div>
            <div>🏆 Total Menang: <span id="winCount">0</span></div>
        </div>

        <div id="stadium">
            <div class="track">
                <div class="finish-line"></div>
                <span id="lion1" class="lion-racer">🦁</span>
                <span class="lane-info">Singa 1: Turbo Beast (Akselerasi Tinggi)</span>
            </div>
            <div class="track">
                <div class="finish-line"></div>
                <span id="lion2" class="lion-racer">🐯</span>
                <span class="lane-info">Singa 2: Blaze Claw (Kecepatan Stabil)</span>
            </div>
            <div class="track">
                <div class="finish-line"></div>
                <span id="lion3" class="lion-racer">🦁</span>
                <span class="lane-info">Singa 3: Shadow Mane (Kejutan Di Akhir)</span>
            </div>
        </div>

        <div class="controls-panel">
            <label for="pilihanSinga">Pilih Jagoanmu: </label>
            <select id="pilihanSinga">
                <option value="0">Singa 1 (Turbo Beast)</option>
                <option value="1">Singa 2 (Blaze Claw)</option>
                <option value="2">Singa 3 (Shadow Mane)</option>
            </select>
            <br>
            <button id="startBtn" onclick="startRace()">Mulai Balapan (Taruhan 20 Koin)!</button>
        </div>

        <div id="announcer">Siap? Silakan mulai balapan!</div>
    </div>

    <script>
        let coins = 100;
        let wins = 0;
        let raceInterval;

        function startRace() {
            if (coins < 20) {
                alert("Koinmu habis! Game over. Silakan refresh halaman untuk main ulang.");
                return;
            }

            // Kurangi koin untuk taruhan
            coins -= 20;
            document.getElementById('coinCount').innerText = coins;
            document.getElementById('startBtn').disabled = true;

            let selectedLion = parseInt(document.getElementById('pilihanSinga').value);
            let positions = [0, 0, 0];
            let velocities = [0, 0, 0];

            // Reset posisi visual
            for (let i = 0; i < 3; i++) {
                document.getElementById(`lion${i+1}`).style.left = '10px';
            }

            document.getElementById('announcer').innerText = "🏁 Balapan dimulai! Mesin menderu...";

            const trackWidth = document.getElementById('stadium').clientWidth - 80;

            raceInterval = setInterval(function() {
                for (let i = 0; i < 3; i++) {
                    // Karakteristik kecepatan berbeda untuk setiap singa
                    let randomFactor = Math.random() * 2.8 - 1.1;
                    if (i === 2) randomFactor += 0.1; // Singa 3 punya sedikit bonus kejut

                    velocities[i] += randomFactor;
                    if (velocities[i] < 1.5) velocities[i] = 1.5;
                    if (velocities[i] > 13) velocities[i] = 13;

                    positions[i] += velocities[i];
                    if (positions[i] > trackWidth) positions[i] = trackWidth;

                    document.getElementById(`lion${i+1}`).style.left = positions[i] + 'px';
                }

                let winnerIdx = positions.findIndex(pos => pos >= trackWidth);
                if (winnerIdx !== -1) {
                    clearInterval(raceInterval);
                    document.getElementById('startBtn').disabled = false;

                    let winnerNames = ["Singa 1 (Turbo Beast)", "Singa 2 (Blaze Claw)", "Singa 3 (Shadow Mane)"];
                    let resultText = `🏆 Pemenang: ${winnerNames[winnerIdx]}! `;

                    if (winnerIdx === selectedLion) {
                        coins += 50; // Hadiah kemenangan
                        wins += 1;
                        resultText += "🎉 Tebakanmu BENAR! Kamu mendapatkan +50 Koin!";
                    } else {
                        resultText += "❌ Tebakanmu meleset. Coba lagi!";
                    }

                    document.getElementById('coinCount').innerText = coins;
                    document.getElementById('winCount').innerText = wins;
                    document.getElementById('announcer').innerText = resultText;
                }
            }, 40);
        }
    </script>

</body>
</html>
